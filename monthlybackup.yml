name: 每月完整備份

# 每月5號寄一份「完整」備份：資料 ＋ 五個儀表板網頁 ＋ 通知程式 ＋ 歷次 SQL 指令。
# 每天的資料備份是另一個檔（daily-backup.yml），兩個要一起裝。

on:
  schedule:
    # 每月5號台灣時間早上9點（GitHub 用的是 UTC，所以寫 1 點）
    - cron: '0 1 5 * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v5

      - name: 設定 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 產生備份並寄出
        env:
          BACKUP_MODE: full
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # 備份信的收件人：有設 BACKUP_EMAIL 就寄給它，沒設就沿用 NOTIFY_EMAIL。
          # 這樣「到期通知寄給大家、備份只寄給指定的人」可以分開，也不會因為忘了設而寄不出去。
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL || secrets.NOTIFY_EMAIL }}
        run: node backup_monthly.js

# 兩個提醒：
# 1. 這個 repo 若是公開的，這裡「刻意不用」actions/upload-artifact 保存備份檔。
#    公開 repo 的 artifact 任何人都能下載，備份裡有員工個資，只能走信件寄給指定收件人。
# 2. GitHub 規定：repo 連續 60 天沒有任何 commit，排程工作會被自動停用。
#    真的停了，到 Actions 頁面按一下 Enable workflow 就會恢復。
