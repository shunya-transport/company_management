name: 板架-保養-證照到期通知

on:
  schedule:
    - cron: '0 1 1 * *'
    - cron: '0 1 15 * *'
  workflow_dispatch: {}

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v5

      - name: 設定 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # 每次都抓 22 版最新的修補版（115/10 Node.js 安全更新要求 22.23.4 以上），
          # 不用等 GitHub 的機器映像更新
          check-latest: true

      - name: 執行到期檢查並寄信
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: node check_trailer_maint_cert.js
