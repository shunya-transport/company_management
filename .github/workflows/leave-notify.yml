name: 線上請假通知信

on:
  schedule:
    # 每 10 分鐘看一次有沒有要寄的請假通知（GitHub 排程尖峰時可能晚幾分鐘）
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: leave-notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v5

      - name: 設定 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          check-latest: true

      - name: 寄出請假通知
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node check_leave_notify.js
